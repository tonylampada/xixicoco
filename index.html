<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Relatório Desfralde — Isaac</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --orange: #d29922; --purple: #bc8cff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
h1 { font-size:1.4em; margin-bottom:4px; }
.subtitle { color:var(--muted); font-size:0.85em; margin-bottom:16px; }
.tabs { display:flex; gap:8px; margin-bottom:20px; }
.tab { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; font-size:0.9em; }
.tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:24px; }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
.kpi .value { font-size:1.6em; font-weight:700; }
.kpi .label { font-size:0.75em; color:var(--muted); margin-top:4px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
.card h2 { font-size:1em; margin-bottom:12px; color:var(--accent); }
canvas { max-height:260px; }
table { width:100%; border-collapse:collapse; font-size:0.8em; }
th, td { padding:6px 8px; border-bottom:1px solid var(--border); text-align:left; }
th { color:var(--muted); font-weight:600; }
.bar-bg { background:var(--border); border-radius:4px; height:8px; width:100%; }
.bar-fill { height:8px; border-radius:4px; }
.good { color:var(--green); }
.bad { color:var(--red); }
.warn { color:var(--orange); }
.loading { text-align:center; padding:60px; color:var(--muted); }
@media(max-width:600px) {
  .kpis { grid-template-columns:repeat(2,1fr); }
  table { font-size:0.7em; }
  th, td { padding:4px; }
}
</style>
</head>
<body>
<h1>Relatório Desfralde — Isaac</h1>
<div class="subtitle" id="subtitle">Carregando...</div>
<div class="tabs">
  <div class="tab active" data-tab="full">Histórico Completo</div>
  <div class="tab" data-tab="recent">Histórico Recente</div>
  <button class="tab" id="downloadDaily" style="margin-left:auto;font-family:inherit;">⬇ CSV diário</button>
</div>
<div id="recentControls" style="display:none;margin-bottom:16px;">
  <label for="daysInput" style="font-size:0.85em;color:var(--muted);margin-right:8px;">Últimos</label>
  <input id="daysInput" type="number" min="1" value="28" style="width:80px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.9em;">
  <span style="font-size:0.85em;color:var(--muted);margin-left:8px;">dias</span>
</div>
<div id="content"><div class="loading">Carregando CSV...</div></div>

<script>
const CSV_URL = 'xixicoco.csv';
let allRows = [];
let currentTab = 'full';

// Parse CSV
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',');
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { vals.push(cur); cur = ''; continue; }
      cur += c;
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
    return obj;
  });
}

// Utils
function weekKey(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const dayOfYear = Math.floor((d - jan1) / 86400000) + 1;
  const weekNum = Math.ceil((dayOfYear + jan1.getDay()) / 7);
  return `${d.getFullYear()}-S${String(weekNum).padStart(2,'0')}`;
}

function weekLabel(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDate();
  const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${day}/${months[d.getMonth()]}`;
}

function getMonday(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.getFullYear(), d.getMonth(), diff);
}

function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}

function isSuccess(r) {
  return r.sucesso === 'sim' && r.tipo !== 'escape' && r.tipo !== 'nao_fez' && r.tipo !== 'outro';
}

function isEscape(r) { return r.tipo === 'escape'; }
function isNaoFez(r) { return r.tipo === 'nao_fez'; }

function isIndependent(r) {
  const i = r.iniciativa.toLowerCase();
  return i === 'sozinho' || i === 'pediu';
}

function periodOfDay(hora) {
  if (!hora) return 'Desconhecido';
  const h = parseInt(hora.split(':')[0]);
  if (h < 12) return 'Manhã (6h–12h)';
  if (h < 18) return 'Tarde (12h–18h)';
  return 'Noite (18h–0h)';
}

function escapeSubtype(r) {
  const text = `${r.texto_original || ''} ${r.notas || ''}`.toLowerCase();
  const local = (r.local || '').toLowerCase();
  const hasBathroomTransition = [
    'foi no banheiro', 'foi ao banheiro', 'foi para o banheiro', 'foi pro banheiro',
    'correu para o banheiro', 'correu pro banheiro', 'depois foi no banheiro',
    'depois foi pro banheiro', 'terminou no banheiro', 'entrou no banheiro',
    'voltou pro banheiro', 'voltou ao banheiro'
  ].some(k => text.includes(k));
  const hasWetClothes = [
    'roupa', 'cueca', 'calça', 'calca', 'calção', 'calcao', 'fralda'
  ].some(k => local === k) || [
    'na roupa', 'na cueca', 'na calça', 'na calca', 'na calção', 'na calcao', 'na fralda',
    'na calça', 'na calca'
  ].some(k => text.includes(k));
  const sofaLike = local === 'sofa' || local === 'cadeira' || local === 'tapete' || [
    'sofá', 'sofa', 'cadeira', 'tapete', 'cama'
  ].some(k => text.includes(k));
  const noPerception = ['não percebeu', 'nao percebeu', 'nem percebeu', 'sem perceber', 'não percebe', 'nao percebe', 'não notou', 'nao notou']
    .some(k => text.includes(k));
  const alreadyWet = ['já tava mijado', 'ja tava mijado', 'já estava mijado', 'ja estava mijado', 'já tinha feito', 'ja tinha feito']
    .some(k => text.includes(k));

  if (sofaLike && (noPerception || text.includes('mijou no sofá') || text.includes('mijou no sofa') || text.includes('escape no sofa') || text.includes('escape no sofá'))) {
    return 'Sofá / sem perceber';
  }
  if (hasWetClothes && (hasBathroomTransition || alreadyWet)) {
    return 'Roupa -> banheiro';
  }
  if (sofaLike) return 'Sofá / sem perceber';
  if (hasWetClothes) return 'Roupa -> banheiro';
  if (hasBathroomTransition || alreadyWet) return 'Roupa -> banheiro';
  return 'Outro escape';
}

const DOW_NAMES = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function computeData(rows) {
  if (!rows.length) return null;

  const dates = [...new Set(rows.map(r => r.data))].sort();
  const firstDate = dates[0];
  const lastDate = dates[dates.length - 1];
  const numDays = dates.length;

  const successes = rows.filter(isSuccess);
  const escapes = rows.filter(isEscape);
  const naoFez = rows.filter(isNaoFez);
  const events = rows.filter(r => r.tipo !== 'outro');

  const totalUseful = successes.length + escapes.length;
  const taxaSucesso = totalUseful > 0 ? (successes.length / totalUseful * 100) : 0;

  const independents = successes.filter(isIndependent);
  const indPct = successes.length > 0 ? (independents.length / successes.length * 100) : 0;

  // Coco
  const cocoRows = rows.filter(r => r.tipo === 'coco' || r.tipo === 'xixi_e_coco');
  const cocoEscape = rows.filter(r => {
    if (r.tipo !== 'escape') return false;
    const text = `${r.notas || ''} ${r.texto_original || ''}`.toLowerCase();
    return text.includes('cocô') || text.includes('coco') || text.includes('💩');
  });
  const cocoVaso = cocoRows.length;
  const cocoTotal = cocoVaso + cocoEscape.length;
  const cocoPct = cocoTotal > 0 ? (cocoVaso / cocoTotal * 100) : 0;

  // Weekly — buckets of 7 days, anchored at the last available date
  const lastDateObj = new Date(lastDate + 'T12:00:00');
  const weekMap = new Map();
  dates.forEach(d => {
    const dObj = new Date(d + 'T12:00:00');
    const daysDiff = Math.floor((lastDateObj - dObj) / 86400000);
    const bucket = Math.floor(daysDiff / 7);
    const bucketStart = new Date(lastDateObj);
    bucketStart.setDate(bucketStart.getDate() - (bucket * 7 + 6));
    const key = fmtDate(bucketStart);
    if (!weekMap.has(key)) weekMap.set(key, { start: key, dates: new Set() });
    weekMap.get(key).dates.add(d);
  });

  const weeks = [];
  for (const [mon, info] of [...weekMap.entries()].sort()) {
    const wRows = rows.filter(r => info.dates.has(r.data));
    const wSucc = wRows.filter(isSuccess);
    const wEsc = wRows.filter(isEscape);
    const wNao = wRows.filter(isNaoFez);
    const wUseful = wSucc.length + wEsc.length;
    const wInd = wSucc.filter(isIndependent);
    weeks.push({
      label: weekLabel(info.start),
      days: info.dates.size,
      success: wSucc.length,
      escape: wEsc.length,
      nao_fez: wNao.length,
      success_rate: wUseful > 0 ? (wSucc.length / wUseful * 100) : 0,
      escapes_per_day: info.dates.size > 0 ? (wEsc.length / info.dates.size) : 0,
      independence: wSucc.length > 0 ? (wInd.length / wSucc.length * 100) : 0,
    });
  }

  // 7-day rolling
  const daily = new Map();
  dates.forEach(d => daily.set(d, { success: 0, escape: 0 }));
  rows.forEach(r => {
    if (!daily.has(r.data)) return;
    if (isSuccess(r)) daily.get(r.data).success++;
    if (isEscape(r)) daily.get(r.data).escape++;
  });
  const trend = [];
  const sortedDates = [...daily.keys()].sort();
  for (let i = 0; i < sortedDates.length; i++) {
    const window = sortedDates.slice(Math.max(0, i - 6), i + 1);
    let s = 0, e = 0;
    window.forEach(d => { s += daily.get(d).success; e += daily.get(d).escape; });
    const tot = s + e;
    trend.push({
      date: sortedDates[i],
      rate: tot > 0 ? (s / tot * 100) : null,
      escapes: daily.get(sortedDates[i]).escape,
    });
  }

  // Escapes by period
  const escPeriod = {};
  escapes.forEach(r => {
    const p = periodOfDay(r.hora);
    escPeriod[p] = (escPeriod[p] || 0) + 1;
  });

  // Escapes by day of week
  const escDow = {};
  const totalDow = {};
  rows.forEach(r => {
    const d = new Date(r.data + 'T12:00:00');
    const dow = DOW_NAMES[d.getDay()];
    totalDow[dow] = (totalDow[dow] || 0) + 1;
    if (isEscape(r)) escDow[dow] = (escDow[dow] || 0) + 1;
  });
  const dowData = DOW_NAMES.map(d => ({
    label: d,
    escape_rate: totalDow[d] ? ((escDow[d] || 0) / totalDow[d] * 100) : 0
  }));

  // Activities during escape
  const actMap = {};
  escapes.forEach(r => {
    let act = (r.atividade_escape || '').trim();
    if (!act) act = 'Não informado';
    actMap[act] = (actMap[act] || 0) + 1;
  });
  const activities = Object.entries(actMap)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10)
    .map(([label, count]) => ({ label, count }));

  // Escape subtypes (heurísticos)
  const escapeSubtypeTotals = { 'Sofá / sem perceber': 0, 'Roupa -> banheiro': 0, 'Outro escape': 0 };
  const escapeSubtypeWeekly = [];
  for (const [mon, info] of [...weekMap.entries()].sort()) {
    const wRows = rows.filter(r => info.dates.has(r.data) && isEscape(r));
    const counts = { 'Sofá / sem perceber': 0, 'Roupa -> banheiro': 0, 'Outro escape': 0 };
    wRows.forEach(r => {
      const key = escapeSubtype(r);
      counts[key] = (counts[key] || 0) + 1;
      escapeSubtypeTotals[key] = (escapeSubtypeTotals[key] || 0) + 1;
    });
    escapeSubtypeWeekly.push({
      label: weekLabel(info.start),
      'Sofá / sem perceber': counts['Sofá / sem perceber'],
      'Roupa -> banheiro': counts['Roupa -> banheiro'],
      'Outro escape': counts['Outro escape'],
    });
  }

  // Initiative
  const initMap = {};
  successes.forEach(r => {
    let ini = (r.iniciativa || '').trim();
    if (!ini) ini = 'Não informado';
    initMap[ini] = (initMap[ini] || 0) + 1;
  });
  const initiative = Object.entries(initMap)
    .sort((a, b) => b[1] - a[1])
    .map(([label, count]) => ({ label, count, pct: (count / successes.length * 100) }));

  // Interval
  const dayTimes = new Map();
  rows.filter(r => isSuccess(r) || isEscape(r)).forEach(r => {
    if (!r.hora) return;
    const mins = parseInt(r.hora.split(':')[0]) * 60 + parseInt(r.hora.split(':')[1]);
    if (!dayTimes.has(r.data)) dayTimes.set(r.data, []);
    dayTimes.get(r.data).push(mins);
  });
  let intervals = [];
  for (const [, times] of dayTimes) {
    const sorted = times.sort((a, b) => a - b);
    for (let i = 1; i < sorted.length; i++) intervals.push(sorted[i] - sorted[i - 1]);
  }
  const avgInterval = intervals.length > 0 ? Math.round(intervals.reduce((a, b) => a + b, 0) / intervals.length) : 0;

  return {
    periodo: { inicio: firstDate, fim: lastDate, dias: numDays, total: rows.length },
    kpis: { taxaSucesso, escapesPerDay: (escapes.length / numDays), sucessosPerDay: (successes.length / numDays), indPct, avgInterval, cocoPct },
    weeks, trend, escPeriod, dowData, activities, initiative,
    escapeSubtypeTotals, escapeSubtypeWeekly,
    coco: { total: cocoTotal, noVaso: cocoVaso, escape: cocoEscape.length, pct: cocoPct },
    naoFez: { total: naoFez.length, perDay: (naoFez.length / numDays) }
  };
}

// Destroy existing charts
let charts = [];
function destroyCharts() {
  charts.forEach(c => c.destroy());
  charts = [];
}

function render(data) {
  if (!data) {
    document.getElementById('content').innerHTML = '<div class="loading">Sem dados para o período</div>';
    return;
  }
  const D = data;
  const P = D.periodo;

  document.getElementById('subtitle').textContent = `${P.inicio} a ${P.fim} · ${P.dias} dias · ${P.total} registros`;

  destroyCharts();

  const html = `
    <div class="kpis">
      <div class="kpi"><div class="value ${D.kpis.taxaSucesso >= 80 ? 'good' : D.kpis.taxaSucesso >= 60 ? 'warn' : 'bad'}">${D.kpis.taxaSucesso.toFixed(0)}%</div><div class="label">Taxa de Sucesso</div></div>
      <div class="kpi"><div class="value ${D.kpis.escapesPerDay <= 2 ? 'good' : D.kpis.escapesPerDay <= 3 ? 'warn' : 'bad'}">${D.kpis.escapesPerDay.toFixed(1)}</div><div class="label">Escapes / Dia</div></div>
      <div class="kpi"><div class="value good">${D.kpis.sucessosPerDay.toFixed(1)}</div><div class="label">Sucessos / Dia</div></div>
      <div class="kpi"><div class="value ${D.kpis.indPct >= 40 ? 'good' : D.kpis.indPct >= 20 ? 'warn' : 'bad'}">${D.kpis.indPct.toFixed(0)}%</div><div class="label">Independência</div></div>
      <div class="kpi"><div class="value">${D.kpis.avgInterval} min</div><div class="label">Intervalo Médio</div></div>
      <div class="kpi"><div class="value ${D.kpis.cocoPct >= 70 ? 'good' : D.kpis.cocoPct >= 50 ? 'warn' : 'bad'}">${D.kpis.cocoPct.toFixed(0)}%</div><div class="label">Cocô no Vaso</div></div>
    </div>

    <div class="card">
      <h2>Evolução Semanal</h2>
      <canvas id="weeklyChart"></canvas>
    </div>

    <div class="card">
      <h2>Tendência 7 dias (taxa de sucesso) + escapes/dia</h2>
      <canvas id="trendChart"></canvas>
    </div>

    <div class="card">
      <h2>Independência Semanal</h2>
      <canvas id="indChart"></canvas>
    </div>

    <div class="card">
      <h2>Escapes por Período</h2>
      <canvas id="periodChart"></canvas>
    </div>

    <div class="card">
      <h2>Escapes por Dia da Semana</h2>
      <canvas id="dowChart"></canvas>
    </div>

    <div class="card">
      <h2>Atividade Durante Escapes</h2>
      <canvas id="actChart"></canvas>
    </div>

    <div class="card">
      <h2>Subtipos de Escape</h2>
      <div style="font-size:0.8em;color:var(--muted);margin-bottom:8px">Classificação heurística a partir de texto_original/notas.</div>
      <table>
        <thead><tr><th>Subtipo</th><th>Qtd</th></tr></thead>
        <tbody>
          <tr><td>Sofá / sem perceber</td><td>${D.escapeSubtypeTotals['Sofá / sem perceber']}</td></tr>
          <tr><td>Roupa → banheiro</td><td>${D.escapeSubtypeTotals['Roupa -> banheiro']}</td></tr>
          <tr><td>Outro escape</td><td>${D.escapeSubtypeTotals['Outro escape']}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Evolução dos Subtipos de Escape</h2>
      <canvas id="escapeSubtypeChart"></canvas>
    </div>

    <div class="card">
      <h2>Detalhamento Semanal</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Semana</th><th>Dias</th><th>Sucessos</th><th>Escapes</th><th>Não Fez</th><th>Taxa</th><th>Esc/Dia</th><th>Indep.</th><th></th></tr></thead>
          <tbody>${D.weeks.map(w => `<tr>
            <td>${w.label}</td><td>${w.days}</td><td>${w.success}</td><td>${w.escape}</td><td>${w.nao_fez}</td>
            <td class="${w.success_rate >= 80 ? 'good' : w.success_rate >= 60 ? 'warn' : 'bad'}">${w.success_rate.toFixed(0)}%</td>
            <td class="${w.escapes_per_day <= 2 ? 'good' : 'bad'}">${w.escapes_per_day.toFixed(1)}</td>
            <td>${w.independence.toFixed(0)}%</td>
            <td style="width:80px"><div class="bar-bg"><div class="bar-fill" style="width:${w.success_rate}%;background:${w.success_rate >= 80 ? 'var(--green)' : w.success_rate >= 60 ? 'var(--orange)' : 'var(--red)'}"></div></div></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Iniciativa</h2>
      <table>
        <thead><tr><th>Tipo</th><th>Qtd</th><th>%</th></tr></thead>
        <tbody>${D.initiative.map(i => `<tr><td>${i.label}</td><td>${i.count}</td><td>${i.pct.toFixed(1)}%</td></tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="card">
      <h2>Cocô</h2>
      <table>
        <tr><td>No vaso</td><td class="good">${D.coco.noVaso} (${D.coco.pct.toFixed(0)}%)</td></tr>
        <tr><td>Escape</td><td class="bad">${D.coco.escape} (${D.coco.total > 0 ? (100 - D.coco.pct).toFixed(0) : 0}%)</td></tr>
        <tr><td>Total</td><td>${D.coco.total}</td></tr>
      </table>
    </div>
  `;

  document.getElementById('content').innerHTML = html;

  // Charts
  const chartOpts = {
    responsive: true,
    plugins: { legend: { labels: { color: '#8b949e', font: { size: 11 } } } },
    scales: {
      x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
      y: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } }
    }
  };

  // Weekly stacked
  charts.push(new Chart(document.getElementById('weeklyChart'), {
    type: 'bar',
    data: {
      labels: D.weeks.map(w => w.label),
      datasets: [
        { label: 'Sucessos', data: D.weeks.map(w => w.success), backgroundColor: '#3fb950' },
        { label: 'Escapes', data: D.weeks.map(w => w.escape), backgroundColor: '#f85149' },
        { label: 'Não Fez', data: D.weeks.map(w => w.nao_fez), backgroundColor: '#8b949e' },
      ]
    },
    options: { ...chartOpts, scales: { ...chartOpts.scales, x: { ...chartOpts.scales.x, stacked: true }, y: { ...chartOpts.scales.y, stacked: true } } }
  }));

  // Trend
  const maxEsc = Math.max(1, ...D.trend.map(t => t.escapes || 0));
  charts.push(new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: D.trend.map(t => t.date.slice(5)),
      datasets: [
        { label: 'Taxa 7d (%)', data: D.trend.map(t => t.rate), borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)', fill: true, tension: 0.3, pointRadius: 0, yAxisID: 'y' },
        { label: 'Escapes/dia', data: D.trend.map(t => t.escapes), borderColor: '#f85149', backgroundColor: 'rgba(248,81,73,0.05)', fill: false, tension: 0.2, pointRadius: 2, pointBackgroundColor: '#f85149', yAxisID: 'y1' }
      ]
    },
    options: {
      ...chartOpts,
      scales: {
        x: chartOpts.scales.x,
        y: { ...chartOpts.scales.y, position: 'left', min: 0, max: 100, title: { display: true, text: 'Taxa %', color: '#8b949e' } },
        y1: { ticks: { color: '#8b949e', font: { size: 10 }, precision: 0 }, grid: { drawOnChartArea: false }, position: 'right', min: 0, max: maxEsc + 1, title: { display: true, text: 'Escapes', color: '#8b949e' } }
      }
    }
  }));

  // Independence
  charts.push(new Chart(document.getElementById('indChart'), {
    type: 'bar',
    data: {
      labels: D.weeks.map(w => w.label),
      datasets: [{ label: 'Independência %', data: D.weeks.map(w => w.independence), backgroundColor: '#bc8cff' }]
    },
    options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, min: 0, max: 100 } } }
  }));

  // Escapes by period
  const periods = Object.entries(D.escPeriod).sort((a, b) => b[1] - a[1]);
  charts.push(new Chart(document.getElementById('periodChart'), {
    type: 'bar',
    data: {
      labels: periods.map(p => p[0]),
      datasets: [{ label: 'Escapes', data: periods.map(p => p[1]), backgroundColor: '#f85149' }]
    },
    options: { ...chartOpts, indexAxis: 'y' }
  }));

  // Day of week
  charts.push(new Chart(document.getElementById('dowChart'), {
    type: 'bar',
    data: {
      labels: D.dowData.map(d => d.label),
      datasets: [{ label: 'Taxa Escape %', data: D.dowData.map(d => d.escape_rate), backgroundColor: D.dowData.map(d => d.escape_rate >= 25 ? '#f85149' : d.escape_rate >= 20 ? '#d29922' : '#3fb950') }]
    },
    options: chartOpts
  }));

  // Activities
  charts.push(new Chart(document.getElementById('actChart'), {
    type: 'bar',
    data: {
      labels: D.activities.map(a => a.label),
      datasets: [{ label: 'Ocorrências', data: D.activities.map(a => a.count), backgroundColor: '#d29922' }]
    },
    options: { ...chartOpts, indexAxis: 'y' }
  }));

  // Escape subtype evolution
  charts.push(new Chart(document.getElementById('escapeSubtypeChart'), {
    type: 'bar',
    data: {
      labels: D.escapeSubtypeWeekly.map(w => w.label),
      datasets: [
        { label: 'Sofá / sem perceber', data: D.escapeSubtypeWeekly.map(w => w['Sofá / sem perceber']), backgroundColor: '#f85149' },
        { label: 'Roupa → banheiro', data: D.escapeSubtypeWeekly.map(w => w['Roupa -> banheiro']), backgroundColor: '#d29922' },
        { label: 'Outro escape', data: D.escapeSubtypeWeekly.map(w => w['Outro escape']), backgroundColor: '#8b949e' },
      ]
    },
    options: { ...chartOpts, scales: { ...chartOpts.scales, x: { ...chartOpts.scales.x, stacked: true }, y: { ...chartOpts.scales.y, stacked: true } } }
  }));
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    document.getElementById('recentControls').style.display = currentTab === 'recent' ? 'block' : 'none';
    applyFilter();
  });
});

document.getElementById('daysInput').addEventListener('input', () => {
  if (currentTab === 'recent') applyFilter();
});

function buildDailyCSV(rows) {
  const byDay = new Map();
  rows.forEach(r => {
    if (!byDay.has(r.data)) byDay.set(r.data, []);
    byDay.get(r.data).push(r);
  });
  const headers = ['data','dia_semana','eventos','sucessos','escapes','nao_fez','xixi_vaso','coco_vaso','independentes','taxa_sucesso_pct'];
  const lines = [headers.join(',')];
  [...byDay.keys()].sort().forEach(date => {
    const dayRows = byDay.get(date);
    const succ = dayRows.filter(isSuccess);
    const esc = dayRows.filter(isEscape);
    const nao = dayRows.filter(isNaoFez);
    const xixi = dayRows.filter(r => r.tipo === 'xixi' && r.sucesso === 'sim');
    const coco = dayRows.filter(r => (r.tipo === 'coco' || r.tipo === 'xixi_e_coco') && r.sucesso === 'sim');
    const ind = succ.filter(isIndependent);
    const useful = succ.length + esc.length;
    const rate = useful > 0 ? (succ.length / useful * 100).toFixed(1) : '';
    const dow = dayRows[0].dia_semana || '';
    lines.push([date, dow, dayRows.length, succ.length, esc.length, nao.length, xixi.length, coco.length, ind.length, rate].join(','));
  });
  return lines.join('\n');
}

document.getElementById('downloadDaily').addEventListener('click', () => {
  const csv = buildDailyCSV(allRows);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'xixicoco-diario.csv';
  a.click();
  URL.revokeObjectURL(url);
});

function applyFilter() {
  let rows = allRows;
  if (currentTab === 'recent') {
    const days = Math.max(1, parseInt(document.getElementById('daysInput').value, 10) || 28);
    const dates = [...new Set(rows.map(r => r.data))].sort();
    if (dates.length > 0) {
      const last = new Date(dates[dates.length - 1] + 'T12:00:00');
      const cutoff = new Date(last);
      cutoff.setDate(cutoff.getDate() - (days - 1));
      const cutStr = fmtDate(cutoff);
      rows = rows.filter(r => r.data >= cutStr);
    }
  }
  render(computeData(rows));
}

// Load CSV
fetch(CSV_URL)
  .then(r => { if (!r.ok) throw new Error('CSV not found'); return r.text(); })
  .then(text => {
    allRows = parseCSV(text);
    applyFilter();
  })
  .catch(err => {
    document.getElementById('content').innerHTML = `<div class="loading">Erro: ${err.message}</div>`;
  });
</script>
